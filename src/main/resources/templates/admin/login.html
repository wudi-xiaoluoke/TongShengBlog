<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理端登录 — 同生的手账本</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h1>📖 管理端</h1>
    <p class="sub">同生的手账本 · 博主入口</p>

    <p class="err" th:if="${error}" th:text="${error}"></p>

    <form method="post" th:action="@{/admin/login}">
      <input name="username" placeholder="用户名" required autofocus>
      <input name="password" type="password" placeholder="密码" required>
      <button type="submit">登 录</button>
    </form>

    <p class="tip"><a href="/">← 回主页</a></p>
  </div>
</div>
</body>
</html>
