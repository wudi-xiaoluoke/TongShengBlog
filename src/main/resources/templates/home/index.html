<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同生的手账本 — 手写手账</title>
  <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<div class="wrap">

  <header th:replace="~{fragments/layout :: header}"></header>

  <!-- 登录便签：写下名字点签到，弹出双便签选「注册 / 登录」 -->
  <div class="sticky-login" id="sticky-login" th:attr="data-api=@{/api/auth}">
    <b>留下你的名字</b>
    <form id="login-note-form">
      <input type="text" id="visitor-name" maxlength="16" placeholder="你的名字" autocomplete="username">
      <button type="submit">签到 ✎</button>
    </form>
    <p class="login-greet" id="login-greet" hidden></p>
  </div>

  <!-- 双便签弹层：注册 / 登录，点另一张便签翻页切换 -->
  <div class="auth-overlay" id="auth-overlay" hidden>
    <div class="auth-cards" aria-label="注册或登录">
      <button type="button" class="auth-close" id="auth-close" aria-label="关闭">✕</button>

      <section class="auth-note note-register is-front" id="note-register">
        <i class="auth-tape" aria-hidden="true"></i>
        <h3>新客登记</h3>
        <p class="auth-sub">起个名字设个密码，<br>零食店、手账、商城都能用</p>
        <form id="register-form">
          <input type="text" id="register-name" maxlength="16" placeholder="你的名字" autocomplete="username">
          <input type="password" id="register-pass" maxlength="32" placeholder="设个密码（4 位以上）" autocomplete="new-password">
          <button type="submit">登记好啦 ✎</button>
        </form>
        <p class="auth-msg" aria-live="polite"></p>
      </section>

      <section class="auth-note note-login is-back" id="note-login">
        <i class="auth-tape" aria-hidden="true"></i>
        <h3>老客回来</h3>
        <p class="auth-sub">名字和密码对上就进门</p>
        <form id="login-form">
          <input type="text" id="login-name" maxlength="16" placeholder="你的名字" autocomplete="username">
          <input type="password" id="login-pass" maxlength="32" placeholder="密码" autocomplete="current-password">
          <button type="submit">进门 ✎</button>
        </form>
        <p class="auth-msg" aria-live="polite"></p>
      </section>
    </div>
  </div>

  <div class="hero">
    <div class="b">今天，也认真过了一天 ✎</div>
    <div class="s">—— 同生 · 手写于 2026.08.09</div>
  </div>

  <!-- 文章浏览工具栏：总数统计 + 每页篇数 + 换一批 -->
  <div class="posts-toolbar">
    <div class="posts-count">
      共 <strong th:text="${total}">0</strong> 篇手账 · 本页随机展示 <strong th:text="${articles.size()}">0</strong> 篇
    </div>
    <div class="posts-actions">
      <form class="size-form" method="get" action="/">
        <label for="page-size">每页显示</label>
        <select id="page-size" name="size" onchange="this.form.submit()">
          <option value="5" th:selected="${pageSize == 5}">5 篇</option>
          <option value="10" th:selected="${pageSize == 10}">10 篇</option>
          <option value="20" th:selected="${pageSize == 20}">20 篇</option>
        </select>
      </form>
      <button type="button" class="shuffle-btn" id="shuffle-btn"
              th:attr="data-endpoint=@{/home/posts}">🔀 换一批</button>
    </div>
  </div>

  <!-- 已发布文章（随机一批） -->
  <div class="posts" id="posts" th:fragment="posts">
    <a class="note" th:each="n : ${articles}" th:href="@{/article/{id}(id=${n.id})}">
      <span class="tape2"></span>
      <div class="date" th:text="${#temporals.format(n.publishTime,'yyyy.MM.dd')}"></div>
      <h3 th:text="${n.title}"></h3>
      <p class="excerpt" th:text="${n.summary}"></p>
      <span class="tag" th:if="${n.categoryId}" th:text="${n.categoryName}"></span>
      <span class="views">
        <svg class="views-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span th:text="${n.views == null ? 0 : n.views}"></span>
      </span>
    </a>
    <p class="empty" th:if="${#lists.isEmpty(articles)}">小本本还空着，等第一篇投稿 ✍️</p>
  </div>

  <!-- 便利贴 -->
  <div class="wishes">
    <div class="card"><p>「愿你三冬暖，愿你春不寒。」</p><div class="who">—— 老周</div></div>
    <div class="card"><p>「读书，行走，然后慢慢生活。」</p><div class="who">—— 小鹿</div></div>
    <div class="card"><p>「别怕，慢慢来。」</p><div class="who">—— 同生</div></div>
  </div>

  <!-- 投稿表单 -->
  <div class="guest" id="guest">
    <div class="t">📝 留下一笔</div>
    <p>写下你的心情、故事或碎碎念，审核通过后就会出现在小本本上。</p>
    <a class="track-entry" th:href="@{/track}">🔍 查投稿进度</a>

    <form method="post" th:action="@{/submit}" th:object="${submit}">
      <div class="field">
        <label>你的昵称</label>
        <input type="text" th:field="*{nickname}" maxlength="50" placeholder="叫我什么好呢">
      </div>
      <div class="field">
        <label>标题</label>
        <input type="text" th:field="*{title}" maxlength="100" placeholder="给今天起个名字">
      </div>
      <div class="field">
        <label>分类（可选）</label>
        <select th:field="*{categoryId}">
          <option value="">无分类</option>
          <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
        </select>
      </div>
      <div class="field">
        <label>内容</label>
        <textarea th:field="*{content}" rows="6" maxlength="5000" placeholder="想说什么就写什么…"></textarea>
      </div>
      <button type="submit">写好啦 ✎</button>
    </form>

    <p class="flash-ok" th:if="${ok}" th:text="${ok}"></p>
    <p class="flash-err" th:if="${error}" th:text="${error}"></p>
  </div>

  <div id="home-music"
       th:attr="data-track-one=@{/audio/mu-xin.mp3},data-track-two=@{/audio/luo-xiao-han.mp3}">
    <button type="button" id="music-toggle" class="music-toggle"
            aria-label="播放背景音乐" aria-pressed="false">
      <span class="music-toggle-icon" aria-hidden="true">▶</span>
    </button>
  </div>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<script th:src="@{/js/home.mjs(v='20260907c')}" type="module"></script>
</body>
</html>
