<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手账 · 同生的手账本</title>
  <link rel="stylesheet" th:href="@{/css/home.css}">
  <link rel="stylesheet" th:href="@{/css/notes.css}">
</head>
<body class="notes-page">
<div class="wrap">

  <header th:replace="~{fragments/layout :: header}"></header>

  <div class="notes-head">
    <h1>📔 手账</h1>
    <p>按时间翻一翻，这些年写过的话</p>
  </div>

  <div class="book-wrap">

    <p class="empty" th:if="${#lists.isEmpty(spreads)}">小本本还空着，等第一篇投稿 ✍️</p>

    <!-- 书的背景：木质桌面 + 摊开的书（皮革书皮 + 书脊） -->
    <div class="book-surface">
      <div class="book" id="book">

      <span class="book-cover left" aria-hidden="true"></span>
      <span class="book-cover right" aria-hidden="true"></span>
      <span class="book-spine" aria-hidden="true"></span>
      <span class="book-page-block" aria-hidden="true"></span>
      <span class="jump-label" id="jumpLabel" aria-live="polite"></span>

      <!-- 摊开的一组书页：左页（较新月份）+ 右页（较旧月份） -->
      <div class="book-spread" th:each="sp, st : ${spreads}"
           th:attr="data-index=${st.index}"
           th:classappend="${st.first} ? 'active'">

        <!-- 左页 -->
        <section class="book-page left" th:if="${sp.left != null}">
          <div class="page-inner" th:attr="data-month=${sp.left.shortLabel}">
            <div class="month-title" th:text="${sp.left.monthLabel}">2026 年 8 月</div>
            <div class="page-entries">
              <a class="entry" th:each="a : ${sp.left.articles}" th:href="@{/article/{id}(id=${a.id})}">
                <div class="e-head">
                  <span class="e-date" th:text="${#temporals.format(a.publishTime,'MM.dd')}">08.09</span>
                  <span class="e-title" th:text="${a.title}">标题</span>
                </div>
                <div class="e-excerpt" th:text="${a.summary}">摘要</div>
                <div class="e-meta">
                  <span class="e-cat" th:if="${a.categoryId}" th:text="${a.categoryName}">分类</span>
                  <span class="e-views">
                    <svg class="views-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <span th:text="${a.views == null ? 0 : a.views}"></span>
                  </span>
                </div>
              </a>
            </div>
          </div>
        </section>

        <!-- 右页 -->
        <section class="book-page right" th:if="${sp.right != null}">
          <div class="page-inner" th:attr="data-month=${sp.right.shortLabel}">
            <div class="month-title" th:text="${sp.right.monthLabel}">2026 年 7 月</div>
            <div class="page-entries">
              <a class="entry" th:each="a : ${sp.right.articles}" th:href="@{/article/{id}(id=${a.id})}">
                <div class="e-head">
                  <span class="e-date" th:text="${#temporals.format(a.publishTime,'MM.dd')}">07.30</span>
                  <span class="e-title" th:text="${a.title}">标题</span>
                </div>
                <div class="e-excerpt" th:text="${a.summary}">摘要</div>
                <div class="e-meta">
                  <span class="e-cat" th:if="${a.categoryId}" th:text="${a.categoryName}">分类</span>
                  <span class="e-views">
                    <svg class="views-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <span th:text="${a.views == null ? 0 : a.views}"></span>
                  </span>
                </div>
              </a>
            </div>
          </div>
        </section>

        <!-- 右页为空（最后奇数个月）：封底 -->
        <section class="book-page right is-empty" th:unless="${sp.right != null}">
          <div class="page-inner">
            <div class="cover-text">未完待续 ✎</div>
          </div>
        </section>
      </div>

      </div>
    </div>

    <!-- 翻页控件 -->
    <div class="book-nav" th:if="${not #lists.isEmpty(spreads)}">
      <button class="nav-btn" id="prevBtn" type="button">← 上一组</button>
      <div class="page-picker">
        <button class="page-indicator" id="pageMenuBtn" type="button"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="pageMenu">第1/1页</button>
        <div class="page-menu" id="pageMenu" role="listbox" aria-labelledby="pageMenuBtn" hidden>
          <th:block th:each="sp, st : ${spreads}">
            <button class="page-option" type="button" role="option"
                    th:attr="data-index=${st.index},aria-selected=${st.first},aria-label=${sp.hasRight() ? ('第 ' + (st.index + 1) + ' 页，' + sp.left.shortLabel + ' 和 ' + sp.right.shortLabel) : ('第 ' + (st.index + 1) + ' 页，' + sp.left.shortLabel)}"
                    th:text="${sp.hasRight() ? ('第 ' + (st.index + 1) + ' 页 · ' + sp.left.shortLabel + ' / ' + sp.right.shortLabel) : ('第 ' + (st.index + 1) + ' 页 · ' + sp.left.shortLabel)}">第 1 页 · 2026.08 / 2026.07</button>
          </th:block>
        </div>
      </div>
      <button class="nav-btn" id="nextBtn" type="button">下一组 →</button>
    </div>

    <!-- 月份索引：点击跳转到含该月的摊开组 -->
    <nav class="month-index" id="monthIndex" aria-label="月份索引" th:if="${not #lists.isEmpty(spreads)}">
      <th:block th:each="sp, st : ${spreads}">
        <button class="mi" type="button"
                th:attr="data-index=${st.index},data-month=${sp.left.shortLabel},aria-label=${'跳到月份 ' + sp.left.shortLabel}"
                th:classappend="${st.first} ? 'on'"
                th:text="${sp.left.shortLabel}">2026.08</button>
        <button class="mi" type="button" th:if="${sp.hasRight()}"
                th:attr="data-index=${st.index},data-month=${sp.right.shortLabel},aria-label=${'跳到月份 ' + sp.right.shortLabel}"
                th:classappend="${st.first} ? 'on'"
                th:text="${sp.right.shortLabel}">2026.07</button>
      </th:block>
    </nav>
  </div>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<script th:src="@{/js/notes.mjs(v='20260823-4')}" type="module"></script>
</body>
</html>
